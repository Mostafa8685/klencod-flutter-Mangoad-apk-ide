name: mango_apk_studio
description: Mango APK Studio - build Android APKs from ZIP projects using GitHub Actions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0
  archive: ^3.6.0
  url_launcher: ^6.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
